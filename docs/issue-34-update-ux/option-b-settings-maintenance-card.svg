<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Option B: Settings maintenance card</title>
  <desc id="desc">Settings page mockup with a maintenance card containing version details and update action.</desc>
  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#101316"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
    <linearGradient id="button" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#242a30" opacity="0.8"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="#08090a"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity="0.55"/>
  <rect x="0" y="0" width="224" height="720" fill="#0b0d0f" stroke="#272b30"/>
  <text x="28" y="48" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="700">coding agent</text>
  <text x="158" y="48" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18">usage</text>
  <text x="28" y="116" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">☤ Overview</text>
  <text x="28" y="166" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">◇ Models</text>
  <text x="28" y="214" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">◆ Usage</text>
  <rect x="16" y="238" width="192" height="38" rx="4" fill="#1a1d20"/>
  <rect x="0" y="244" width="3" height="26" rx="2" fill="#38bdf8"/>
  <text x="28" y="262" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">⚙ Settings</text>

  <g transform="translate(304 74)">
    <text x="0" y="0" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="38" font-weight="700" letter-spacing="-1">Settings</text>
    <text x="0" y="30" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13">Local app preferences and operational controls.</text>

    <rect x="0" y="84" width="850" height="440" rx="8" fill="url(#card)" stroke="#272b30"/>
    <rect x="0" y="84" width="850" height="4" rx="2" fill="url(#button)"/>
    <text x="32" y="140" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="24" font-weight="700">Maintenance</text>
    <text x="32" y="166" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13">Update this local dashboard from the configured upstream branch.</text>

    <g transform="translate(32 212)">
      <rect width="786" height="172" rx="6" fill="#090b0c" stroke="#272b30"/>
      <line x1="0" y1="58" x2="786" y2="58" stroke="#1f2429"/>
      <line x1="0" y1="114" x2="786" y2="114" stroke="#1f2429"/>
      <text x="24" y="36" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="0.8">CURRENT VERSION</text>
      <text x="260" y="36" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">main@a1b2c3d</text>
      <text x="24" y="92" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="0.8">WORKTREE</text>
      <circle cx="264" cy="87" r="5" fill="#34d399"/>
      <text x="280" y="92" fill="#d1fae5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">clean</text>
      <text x="24" y="148" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="0.8">UPSTREAM</text>
      <text x="260" y="148" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">origin/main · fast-forward only</text>
    </g>

    <rect x="32" y="416" width="146" height="44" rx="4" fill="url(#button)"/>
    <text x="58" y="444" fill="#061012" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="800">Update App</text>
    <text x="198" y="443" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">Restart required after a successful update.</text>
  </g>

  <g transform="translate(836 490)">
    <rect width="260" height="92" rx="8" fill="#0b1210" stroke="#34d399"/>
    <text x="22" y="34" fill="#d1fae5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700">Updated to d4e5f6a</text>
    <text x="22" y="60" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">Restart the dashboard to use it.</text>
  </g>
</svg>
