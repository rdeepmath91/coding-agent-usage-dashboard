<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Option A: Footer utility chip</title>
  <desc id="desc">Dashboard overview mockup showing an app version and update chip in the footer.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101316"/>
      <stop offset="1" stop-color="#090a0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2429" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#08090a"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="224" height="720" fill="#0b0d0f" stroke="#272b30"/>
  <text x="28" y="48" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="700">coding agent</text>
  <text x="158" y="48" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18">usage</text>
  <rect x="16" y="92" width="192" height="38" rx="4" fill="#1a1d20"/>
  <rect x="0" y="98" width="3" height="26" rx="2" fill="#38bdf8"/>
  <text x="28" y="116" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">☤ Overview</text>
  <text x="28" y="166" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">◇ Models</text>
  <text x="28" y="214" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">◆ Usage</text>
  <text x="28" y="262" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">⚙ Settings</text>

  <g transform="translate(284 58)">
    <text x="0" y="0" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="38" font-weight="700" letter-spacing="-1">Overview</text>
    <text x="0" y="30" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13">Top cards show full token volume. Session totals and cache details appear in secondary lines.</text>
    <g transform="translate(0 70)">
      <rect width="180" height="118" rx="4" fill="url(#panel)" stroke="#272b30"/>
      <text x="18" y="28" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="1">TOTAL TOKENS</text>
      <text x="18" y="72" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" font-weight="700">18.4M</text>
      <text x="18" y="98" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">incl. cache volume</text>
    </g>
    <g transform="translate(204 70)">
      <rect width="180" height="118" rx="4" fill="url(#panel)" stroke="#272b30"/>
      <text x="18" y="28" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="1">API COST</text>
      <text x="18" y="72" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" font-weight="700">$42.19</text>
      <text x="18" y="98" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">provider matched</text>
    </g>
    <g transform="translate(408 70)">
      <rect width="180" height="118" rx="4" fill="url(#panel)" stroke="#272b30"/>
      <text x="18" y="28" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="1">SESSIONS</text>
      <text x="18" y="72" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" font-weight="700">312</text>
      <text x="18" y="98" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">last 30 days</text>
    </g>
    <rect x="0" y="236" width="868" height="282" rx="6" fill="#0d0f11" stroke="#272b30"/>
    <text x="24" y="274" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" font-weight="700">Daily Tokens by Model</text>
    <path d="M48 456 C135 398 178 426 250 358 S401 382 482 298 S634 332 735 252" fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>
    <path d="M48 498 C130 476 202 492 276 434 S420 472 508 406 S662 442 810 362" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.9"/>
    <g opacity="0.65">
      <line x1="48" y1="316" x2="820" y2="316" stroke="#272b30"/>
      <line x1="48" y1="386" x2="820" y2="386" stroke="#272b30"/>
      <line x1="48" y1="456" x2="820" y2="456" stroke="#272b30"/>
      <line x1="48" y1="526" x2="820" y2="526" stroke="#272b30"/>
    </g>
  </g>

  <g transform="translate(284 651)">
    <text x="0" y="0" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">◇ active sources: opencode.db · codex · hermes</text>
    <text x="420" y="0" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">☤ last updated: 16:42</text>
    <rect x="636" y="-20" width="282" height="32" rx="16" fill="#111315" stroke="#272b30"/>
    <circle cx="654" cy="-4" r="4" fill="#34d399"/>
    <text x="668" y="1" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">app main@a1b2c3d clean</text>
    <rect x="838" y="-17" width="76" height="26" rx="13" fill="#0b1f28" stroke="#38bdf8"/>
    <text x="853" y="0" fill="#7dd3fc" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="700">Update</text>
  </g>

  <rect x="846" y="594" width="278" height="74" rx="6" fill="#0d0f11" stroke="#38bdf8" opacity="0.96"/>
  <text x="866" y="622" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700">Pull latest and sync deps?</text>
  <text x="866" y="646" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">fast-forward only · restart required</text>
</svg>
