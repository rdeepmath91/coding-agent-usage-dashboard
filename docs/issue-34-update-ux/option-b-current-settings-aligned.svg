<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Option B selected: Settings maintenance card aligned to current UI</title>
  <desc id="desc">Current Settings page mockup with a simple Application Update card using the existing narrow card stack style.</desc>
  <defs>
    <filter id="page-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#08090a"/>
  <g opacity="0.34">
    <line x1="0" y1="120" x2="1280" y2="120" stroke="#1a1d20"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#1a1d20"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke="#1a1d20"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#1a1d20"/>
    <line x1="0" y1="600" x2="1280" y2="600" stroke="#1a1d20"/>
  </g>

  <g transform="translate(320 38)" filter="url(#page-shadow)">
    <rect x="-16" y="-24" width="672" height="660" rx="18" fill="#08090a" opacity="0.92"/>
    <text x="0" y="20" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14">← Usage Dashboard</text>
    <text x="0" y="78" fill="#e8eaed" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="24" font-weight="700">Settings</text>

    <g transform="translate(0 110)">
      <rect width="640" height="104" rx="8" fill="#111315" stroke="#272b30"/>
      <text x="20" y="30" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" font-weight="700">Database Location</text>
      <rect x="20" y="46" width="326" height="28" rx="4" fill="#1a1d20"/>
      <text x="30" y="65" fill="#2196F3" font-family="JetBrains Mono, SF Mono, Fira Code, monospace" font-size="13">~/.local/share/opencode/opencode.db</text>
      <text x="20" y="92" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13">Read directly from local coding-agent usage sources.</text>
    </g>

    <g transform="translate(0 230)">
      <rect width="640" height="88" rx="8" fill="#111315" stroke="#272b30"/>
      <text x="20" y="30" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" font-weight="700">Environment Variable</text>
      <rect x="20" y="46" width="142" height="28" rx="4" fill="#1a1d20"/>
      <text x="30" y="65" fill="#2196F3" font-family="JetBrains Mono, SF Mono, Fira Code, monospace" font-size="13">OPENCODE_DB_PATH</text>
    </g>

    <g transform="translate(0 334)">
      <rect width="640" height="122" rx="8" fill="#111315" stroke="#272b30"/>
      <text x="20" y="30" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" font-weight="700">Source</text>
      <text x="20" y="58" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13">Built from normalized local session data. Overview Total Tokens</text>
      <text x="20" y="80" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13">include session tokens plus cache read/write. Cost is an</text>
      <text x="20" y="102" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13">API-equivalent estimate when pricing can be matched.</text>
    </g>

    <g transform="translate(0 472)">
      <rect width="640" height="142" rx="8" fill="#111315" stroke="#272b30"/>
      <text x="20" y="30" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" font-weight="700">Application Update</text>
      <text x="20" y="58" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13">Update this local dashboard from the configured upstream branch.</text>

      <rect x="20" y="74" width="214" height="28" rx="4" fill="#1a1d20"/>
      <circle cx="38" cy="88" r="4" fill="#34d399"/>
      <text x="50" y="93" fill="#2196F3" font-family="JetBrains Mono, SF Mono, Fira Code, monospace" font-size="13">main@a1b2c3d clean</text>

      <rect x="492" y="74" width="128" height="36" rx="6" fill="#2196F3"/>
      <text x="522" y="97" fill="#061018" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" font-weight="700">Update App</text>

      <text x="20" y="126" fill="#5f6368" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="12">Uses git pull --ff-only and uv sync. Restart required after success.</text>
    </g>
  </g>

  <g transform="translate(838 560)">
    <rect width="282" height="78" rx="8" fill="#111315" stroke="#34d399"/>
    <text x="18" y="30" fill="#e8eaed" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" font-weight="700">Success state stays inside card</text>
    <text x="18" y="54" fill="#9aa0a6" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="12">Updated to d4e5f6a. Restart required.</text>
  </g>
</svg>
