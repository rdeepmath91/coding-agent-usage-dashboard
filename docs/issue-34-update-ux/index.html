<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue 34 Update UX Visual Alternatives</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090a;
      --panel: #0d0f11;
      --border: #272b30;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 18% 0%, rgba(56, 189, 248, 0.11), transparent 28rem), var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 40px;
    }
    header { max-width: 1100px; margin: 0 auto 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 46px); letter-spacing: -0.06em; }
    p { color: var(--muted); line-height: 1.6; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 22px; max-width: 1240px; margin: 0 auto; }
    figure { margin: 0; padding: 14px; border: 1px solid var(--border); background: rgba(13, 15, 17, 0.82); border-radius: 10px; }
    .selected { grid-column: 1 / -1; }
    img { display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid #1f2429; }
    figcaption { padding: 12px 2px 0; color: var(--muted); font-size: 13px; }
    strong { color: var(--text); }
  </style>
</head>
<body>
  <header>
    <h1>Issue 34 Update UX Visual Alternatives</h1>
    <p>Selected direction: top-level homepage control with a more evident Option B-style Update App button.</p>
  </header>
  <main class="grid">
    <figure class="selected">
      <img src="selected-homepage-prominent-update.svg" alt="Selected homepage prominent update control mockup">
      <figcaption><strong>Selected:</strong> homepage Overview update panel with larger gradient Update App button.</figcaption>
    </figure>
    <figure>
      <img src="selected-homepage-top-level.svg" alt="Earlier compact homepage update control mockup">
      <figcaption><strong>Earlier homepage version:</strong> compact utility treatment, now too subtle.</figcaption>
    </figure>
    <figure>
      <img src="option-b-current-settings-aligned.svg" alt="Option B settings card mockup">
      <figcaption><strong>Original Option B feel:</strong> larger maintenance-card button treatment.</figcaption>
    </figure>
    <figure>
      <img src="option-d-command-modal.svg" alt="Option D command palette update modal mockup">
      <figcaption><strong>Optional future detail:</strong> command-style update progress modal.</figcaption>
    </figure>
  </main>
</body>
</html>
