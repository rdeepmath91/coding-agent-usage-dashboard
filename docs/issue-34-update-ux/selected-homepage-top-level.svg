<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Selected homepage top-level update control</title>
  <desc id="desc">Current dashboard homepage mockup with a compact update control in the Overview header area.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101316"/>
      <stop offset="1" stop-color="#0d0f11"/>
    </linearGradient>
    <linearGradient id="button" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2429" stroke-width="1" opacity="0.38"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#08090a"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.5"/>

  <rect x="0" y="0" width="224" height="720" fill="#0b0d0f" stroke="#272b30"/>
  <text x="28" y="48" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="700">coding agent</text>
  <text x="158" y="48" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18">usage</text>
  <rect x="16" y="92" width="192" height="38" rx="4" fill="#1a1d20"/>
  <rect x="0" y="98" width="3" height="26" rx="2" fill="#38bdf8"/>
  <text x="28" y="116" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">☤ Overview</text>
  <text x="28" y="166" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">◇ Models</text>
  <text x="28" y="214" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">◆ Usage</text>
  <text x="28" y="262" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">⚙ Settings</text>

  <g transform="translate(284 56)">
    <g>
      <text x="0" y="0" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="38" font-weight="700" letter-spacing="-1">Overview</text>
      <text x="0" y="30" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13">Top cards show full token volume. Session totals and cache details appear in secondary lines.</text>
    </g>

    <g transform="translate(690 -10)">
      <rect width="254" height="74" rx="6" fill="#0d0f11" stroke="#272b30"/>
      <text x="16" y="25" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.7">APP VERSION</text>
      <circle cx="20" cy="48" r="4" fill="#34d399"/>
      <text x="32" y="53" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">main@a1b2c3d clean</text>
      <rect x="156" y="35" width="82" height="26" rx="4" fill="#0b1f28" stroke="#38bdf8"/>
      <text x="171" y="52" fill="#7dd3fc" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="700">Update</text>
    </g>

    <g transform="translate(0 88)">
      <rect width="180" height="118" rx="4" fill="url(#panel)" stroke="#272b30"/>
      <text x="18" y="28" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="1">TOTAL TOKENS</text>
      <text x="18" y="72" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" font-weight="700">18.4M</text>
      <text x="18" y="98" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">incl. cache volume</text>
    </g>
    <g transform="translate(204 88)">
      <rect width="180" height="118" rx="4" fill="url(#panel)" stroke="#272b30"/>
      <text x="18" y="28" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="1">API COST</text>
      <text x="18" y="72" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" font-weight="700">$42.19</text>
      <text x="18" y="98" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">provider matched</text>
    </g>
    <g transform="translate(408 88)">
      <rect width="180" height="118" rx="4" fill="url(#panel)" stroke="#272b30"/>
      <text x="18" y="28" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="1">INPUT TOKENS</text>
      <text x="18" y="72" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" font-weight="700">15.1M</text>
      <text x="18" y="98" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">non-cache + cache</text>
    </g>
    <g transform="translate(612 88)">
      <rect width="180" height="118" rx="4" fill="url(#panel)" stroke="#272b30"/>
      <text x="18" y="28" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="1">SESSIONS</text>
      <text x="18" y="72" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" font-weight="700">312</text>
      <text x="18" y="98" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">last 30 days</text>
    </g>

    <rect x="0" y="252" width="944" height="278" rx="6" fill="#0d0f11" stroke="#272b30"/>
    <text x="24" y="290" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" font-weight="700">Daily Tokens by Model</text>
    <text x="24" y="314" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">Position-based categorical colors · top models by token volume</text>
    <path d="M50 456 C135 398 178 426 250 358 S401 382 482 298 S634 332 735 252 S842 298 890 236" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
    <path d="M50 498 C130 476 202 492 276 434 S420 472 508 406 S662 442 810 362 S862 374 890 350" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.9"/>
    <g opacity="0.65">
      <line x1="50" y1="344" x2="894" y2="344" stroke="#272b30"/>
      <line x1="50" y1="404" x2="894" y2="404" stroke="#272b30"/>
      <line x1="50" y1="464" x2="894" y2="464" stroke="#272b30"/>
      <line x1="50" y1="524" x2="894" y2="524" stroke="#272b30"/>
    </g>
  </g>

  <g transform="translate(897 118)">
    <rect width="322" height="82" rx="6" fill="#0d0f11" stroke="#38bdf8" opacity="0.98"/>
    <text x="18" y="30" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700">Top-level, not primary</text>
    <text x="18" y="54" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">Visible on homepage, but visually smaller than analytics.</text>
  </g>
</svg>
