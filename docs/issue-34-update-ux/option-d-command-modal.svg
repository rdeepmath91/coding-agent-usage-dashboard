<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Option D: Command palette update modal</title>
  <desc id="desc">Dashboard mockup with a terminal-like update modal showing read-only update phases.</desc>
  <defs>
    <linearGradient id="modal" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#12171b"/><stop offset="1" stop-color="#090a0b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.65"/></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="#08090a"/>
  <rect width="1280" height="720" fill="url(#scan)"/>
  <rect x="0" y="0" width="224" height="720" fill="#0b0d0f" stroke="#272b30"/>
  <text x="28" y="48" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="700">coding agent</text>
  <text x="158" y="48" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18">usage</text>
  <rect x="16" y="92" width="192" height="38" rx="4" fill="#1a1d20"/>
  <rect x="0" y="98" width="3" height="26" rx="2" fill="#38bdf8"/>
  <text x="28" y="116" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">☤ Overview</text>
  <text x="28" y="166" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">◇ Models</text>
  <text x="28" y="214" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">◆ Usage</text>
  <text x="28" y="262" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">⚙ Settings</text>

  <g opacity="0.42" transform="translate(284 58)">
    <text x="0" y="0" fill="#f4f4f5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="38" font-weight="700">Overview</text>
    <rect x="0" y="70" width="180" height="118" rx="4" fill="#0d0f11" stroke="#272b30"/>
    <rect x="204" y="70" width="180" height="118" rx="4" fill="#0d0f11" stroke="#272b30"/>
    <rect x="0" y="236" width="868" height="282" rx="6" fill="#0d0f11" stroke="#272b30"/>
    <path d="M48 456 C135 398 178 426 250 358 S401 382 482 298 S634 332 735 252" fill="none" stroke="#38bdf8" stroke-width="4"/>
  </g>

  <rect x="0" y="0" width="1280" height="720" fill="#030405" opacity="0.62"/>
  <g transform="translate(360 142)" filter="url(#shadow)">
    <rect width="640" height="436" rx="10" fill="url(#modal)" stroke="#38bdf8"/>
    <rect x="0" y="0" width="640" height="42" rx="10" fill="#0b1114"/>
    <circle cx="24" cy="21" r="5" fill="#f87171"/>
    <circle cx="44" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="5" fill="#34d399"/>
    <text x="94" y="27" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">local-update.exec</text>
    <text x="586" y="27" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">esc</text>

    <text x="34" y="92" fill="#38bdf8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" font-weight="700">&gt; update app</text>
    <text x="34" y="132" fill="#d1fae5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">✓ checking worktree</text>
    <text x="282" y="132" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">clean</text>
    <text x="34" y="170" fill="#d1fae5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">✓ resolving upstream</text>
    <text x="282" y="170" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">origin/main</text>
    <text x="34" y="208" fill="#d1fae5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">✓ git pull --ff-only</text>
    <text x="282" y="208" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">a1b2c3d → d4e5f6a</text>
    <text x="34" y="246" fill="#fbbf24" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">◐ uv sync</text>
    <rect x="282" y="236" width="250" height="14" rx="7" fill="#1a1d20" stroke="#272b30"/>
    <rect x="282" y="236" width="174" height="14" rx="7" fill="#38bdf8"/>

    <rect x="34" y="296" width="572" height="72" rx="6" fill="#09100e" stroke="#34d399"/>
    <text x="58" y="326" fill="#d1fae5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="700">Update almost done</text>
    <text x="58" y="350" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">Restart the dashboard after sync completes.</text>
    <text x="34" y="406" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">Raw command output stays collapsed behind “Show details”.</text>
  </g>
</svg>
