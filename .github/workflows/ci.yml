name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest tests.test_app tests.test_readme -v

      - name: Compile Python files
        run: uv run python -m py_compile app.py scripts/snapshot_dashboard.py
